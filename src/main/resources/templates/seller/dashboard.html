<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{seller/layout/seller-layout :: main-layout(~{::div})}">
<body>
        <div class="max-w-[1280px] mx-auto px-4 md:px-6 py-6">
        <div class="mb-6">
            <h2 class="text-lg md:text-xl font-bold text-gray-900">Hiệu suất kinh doanh của Shop</h2>
            <p class="mt-1 text-sm text-gray-500">Tổng quan về hoạt động kinh doanh của bạn</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-all duration-300">
                <div class="flex items-center justify-between mb-3">
                    <h5 class="text-sm font-medium text-gray-500 uppercase tracking-wider">💰 Tổng doanh thu</h5>
                    <span class="w-10 h-10 rounded-full bg-brand-blue-soft flex items-center justify-center text-brand-blue text-lg">💰</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-900" th:text="${metrics.totalRevenue != null ? #numbers.formatDecimal(metrics.totalRevenue, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">0 đ</h2>
                <p class="mt-1 text-xs text-gray-400">Tổng doanh thu từ các đơn hàng</p>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-all duration-300">
                <div class="flex items-center justify-between mb-3">
                    <h5 class="text-sm font-medium text-gray-500 uppercase tracking-wider">📦 Đơn hàng mới</h5>
                    <span class="w-10 h-10 rounded-full bg-brand-green-soft flex items-center justify-center text-brand-green text-lg">📦</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-900" th:text="${metrics.totalOrders}">0</h2>
                <p class="mt-1 text-xs text-gray-400">Đơn hàng đang chờ xử lý</p>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-all duration-300">
                <div class="flex items-center justify-between mb-3">
                    <h5 class="text-sm font-medium text-gray-500 uppercase tracking-wider">🛒 Sản phẩm đang bán</h5>
                    <span class="w-10 h-10 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-600 text-lg">🛒</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-900" th:text="${metrics.totalProducts}">0</h2>
                <p class="mt-1 text-xs text-gray-400">Sản phẩm đang hiển thị trên kênh</p>
            </div>
        </div>
        
    </div>
</body>
</html>
