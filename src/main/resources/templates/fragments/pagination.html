<!-- Pagination Fragment -->
<!-- Usage: <div th:replace="~{fragments/pagination :: pagination(page=${products}, baseUrl='/products', queryParams=${selectedCategorySlug != null ? 'category=' + selectedCategorySlug : ''})}"></div> -->
<nav th:fragment="pagination(page, baseUrl, queryParams)"
     th:if="${page != null and page.totalPages > 1}"
     class="flex items-center justify-center gap-2 mt-8 mb-4"
     aria-label="Pagination">

    <!-- Previous -->
    <a th:if="${!page.first}"
       th:href="${queryParams != null and !queryParams.isEmpty() ? baseUrl + '?page=' + (page.number - 1) + '&size=' + page.size + '&' + queryParams : baseUrl + '?page=' + (page.number - 1) + '&size=' + page.size}"
       class="px-3 py-2 rounded-md border border-border-strong text-sm font-medium text-text-primary hover:bg-surface-soft transition-colors">
        ← Trước
    </a>
    <span th:if="${page.first}"
          class="px-3 py-2 rounded-md border border-border text-sm font-medium text-text-secondary/50 cursor-not-allowed">
        ← Trước
    </span>

    <!-- Page Numbers -->
    <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
        <!-- Current page -->
        <span th:if="${i == page.number}"
              class="px-3 py-2 rounded-md bg-brand-blue text-white text-sm font-medium">
            [[${i + 1}]]
        </span>
        <!-- Ellipsis -->
        <span th:if="${(i > 2 and i < page.number - 2) or (i < page.totalPages - 3 and i > page.number + 2)}"
              th:classappend="${i == 3 or i == page.totalPages - 4} ? '' : 'hidden'"
              class="px-2 py-2 text-text-secondary text-sm">…</span>
        <!-- Other pages -->
        <a th:if="${i != page.number and (i <= 2 or i >= page.totalPages - 3 or (i >= page.number - 2 and i <= page.number + 2))}"
           th:href="${queryParams != null and !queryParams.isEmpty() ? baseUrl + '?page=' + i + '&size=' + page.size + '&' + queryParams : baseUrl + '?page=' + i + '&size=' + page.size}"
           class="px-3 py-2 rounded-md border border-border-strong text-sm font-medium text-text-primary hover:bg-surface-soft transition-colors">
            [[${i + 1}]]
        </a>
    </th:block>

    <!-- Next -->
    <a th:if="${!page.last}"
       th:href="${queryParams != null and !queryParams.isEmpty() ? baseUrl + '?page=' + (page.number + 1) + '&size=' + page.size + '&' + queryParams : baseUrl + '?page=' + (page.number + 1) + '&size=' + page.size}"
       class="px-3 py-2 rounded-md border border-border-strong text-sm font-medium text-text-primary hover:bg-surface-soft transition-colors">
        Sau →
    </a>
    <span th:if="${page.last}"
          class="px-3 py-2 rounded-md border border-border text-sm font-medium text-text-secondary/50 cursor-not-allowed">
        Sau →
    </span>
</nav>
