databaseChangeLog:
  - changeSet:
      id: 027-create-user-activity-tables
      author: codex
      changes:
        - createTable:
            tableName: user_viewed_products
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_viewed_products_user
                    references: users(id)
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_viewed_products_product
                    references: products(id)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: viewed_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_viewed_products
            columnNames: user_id, product_id
            constraintName: uk_user_viewed_products_user_product
        - createIndex:
            tableName: user_viewed_products
            indexName: idx_user_viewed_products_user_viewed
            columns:
              - column:
                  name: user_id
              - column:
                  name: viewed_at
        - createIndex:
            tableName: user_viewed_products
            indexName: idx_user_viewed_products_product
            columns:
              - column:
                  name: product_id

        - createTable:
            tableName: user_viewed_shops
